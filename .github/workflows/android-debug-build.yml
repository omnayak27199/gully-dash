name: Android debug build

on:
  workflow_dispatch:
  push:
    branches: ["feature/player-controller"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - "project.godot"
      - "export_presets.cfg"
      - "scenes/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/android-debug-build.yml"

permissions:
  contents: read

jobs:
  android-debug:
    name: Dockerized Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build pinned toolchain image
        run: docker build --pull -t gully-dash-android-builder:local .

      - name: Export debug APK
        run: |
          mkdir -p build
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp/godot-home \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            gully-dash-android-builder:local debug-apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gully-dash-debug-apk
          path: build/GullyDash-debug.apk
          if-no-files-found: error
          retention-days: 14
