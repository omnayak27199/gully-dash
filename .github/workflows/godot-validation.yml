name: Godot validation

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Import project and run controller tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download pinned Godot stable
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.7.2"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot*' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Import project and parse resources
        run: "$GODOT_BIN --headless --editor --path . --quit"

      - name: Run player controller smoke tests
        run: "$GODOT_BIN --headless --path . res://tests/player_controller_test.tscn"

      - name: Run gameplay integration smoke tests
        run: "$GODOT_BIN --headless --path . res://tests/game_smoke_test.tscn"

      - name: Run save manager persistence tests
        run: "$GODOT_BIN --headless --path . res://tests/save_manager_test.tscn"
